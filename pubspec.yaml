name: hangeoleum
description: "한걸음 — 쉬었음 청년을 위한 STEP 1~4 활동 추천 앱 (UI)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # 전역 상태 (ChangeNotifier)
  provider: ^6.1.2
  # 기록 작성 — 파일 첨부
  file_picker: ^13.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 한글 폰트: Pretendard (SIL OFL 1.1, assets/fonts/Pretendard-LICENSE.txt)
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

  assets:
    - assets/images/logo.png

